<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Отворен смартфон в сервиза с батерия, платка и инструменти">
  <defs>
    <radialGradient id="bg" cx="62%" cy="42%" r="75%">
      <stop offset="0" stop-color="#2a1a14"/>
      <stop offset=".55" stop-color="#141212"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a33"/>
      <stop offset="1" stop-color="#151c22"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d4cc"/>
      <stop offset=".5" stop-color="#8f8a84"/>
      <stop offset="1" stop-color="#cfc9c1"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f35"/>
      <stop offset="1" stop-color="#1c1f23"/>
    </linearGradient>
    <linearGradient id="batt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#e8511b"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4d3a"/>
      <stop offset="1" stop-color="#123326"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f48"/>
      <stop offset=".45" stop-color="#1b1e24"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa1a8"/>
      <stop offset=".5" stop-color="#f1f3f5"/>
      <stop offset="1" stop-color="#8b9299"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#d9440f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2c3944" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="640" cy="420" r="430" fill="url(#glow)"/>

  <!-- подложка -->
  <g transform="rotate(-8 600 470)">
    <rect x="150" y="150" width="900" height="640" rx="36" fill="url(#mat)"/>
    <rect x="150" y="150" width="900" height="640" rx="36" fill="url(#grid)" opacity=".7"/>
    <g fill="#2c3944">
      <circle cx="210" cy="210" r="14"/><circle cx="260" cy="210" r="14"/><circle cx="310" cy="210" r="14"/>
      <circle cx="210" cy="260" r="14"/><circle cx="260" cy="260" r="14"/><circle cx="310" cy="260" r="14"/>
    </g>
    <!-- винтчета -->
    <g fill="#c9ced4">
      <circle cx="225" cy="210" r="4"/><circle cx="262" cy="258" r="4"/><circle cx="308" cy="212" r="4"/><circle cx="210" cy="262" r="4"/>
    </g>
  </g>

  <!-- отделено стъкло на телефона -->
  <g filter="url(#sh)" transform="rotate(14 880 470)">
    <rect x="770" y="190" width="250" height="520" rx="44" fill="#0b0c0e"/>
    <rect x="780" y="200" width="230" height="500" rx="36" fill="url(#glass)"/>
    <path d="M800 230 L990 230 L860 690 L800 690 Z" fill="#fff" opacity=".05"/>
    <rect x="865" y="214" width="60" height="16" rx="8" fill="#050506"/>
  </g>

  <!-- отворен телефон -->
  <g filter="url(#sh)" transform="rotate(-6 520 460)">
    <rect x="370" y="160" width="300" height="600" rx="52" fill="url(#frame)"/>
    <rect x="382" y="172" width="276" height="576" rx="42" fill="url(#inner)"/>
    <!-- платка -->
    <path d="M400 192 H640 a10 10 0 0 1 10 10 V330 H400 Z" fill="url(#board)"/>
    <g fill="#0d0f12">
      <rect x="420" y="214" width="70" height="70" rx="10"/>
      <rect x="505" y="218" width="44" height="32" rx="5"/>
      <rect x="505" y="262" width="44" height="22" rx="5"/>
      <rect x="566" y="214" width="60" height="44" rx="7"/>
    </g>
    <rect x="432" y="226" width="46" height="46" rx="6" fill="#2a2f36"/>
    <text x="455" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#9aa1a8">A19</text>
    <g fill="#d6b25a">
      <rect x="572" y="270" width="8" height="40" rx="2"/><rect x="586" y="270" width="8" height="40" rx="2"/><rect x="600" y="270" width="8" height="40" rx="2"/><rect x="614" y="270" width="8" height="40" rx="2"/>
    </g>
    <g stroke="#3f8f6c" stroke-width="2" fill="none" opacity=".8">
      <path d="M420 300 H520 V320"/><path d="M500 300 H560 V320"/><path d="M640 300 V320"/>
    </g>
    <!-- камера -->
    <rect x="588" y="200" width="44" height="12" rx="6" fill="#0d0f12"/>
    <!-- батерия -->
    <rect x="410" y="350" width="220" height="300" rx="20" fill="url(#batt)"/>
    <rect x="410" y="350" width="220" height="300" rx="20" fill="none" stroke="#ffb489" stroke-width="2" opacity=".6"/>
    <path d="M410 370 a20 20 0 0 1 20 -20 H470 L410 430 Z" fill="#fff" opacity=".12"/>
    <path d="M530 430 l-34 70 h28 l-14 62 46 -86 h-30 l18 -46 z" fill="#fff" opacity=".92"/>
    <text x="520" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" opacity=".85" letter-spacing="2">GDMobil</text>
    <!-- лентов кабел -->
    <rect x="600" y="330" width="22" height="40" rx="4" fill="#d9a23a"/>
    <!-- долна част: говорител и букса -->
    <g fill="#0d0f12">
      <rect x="410" y="676" width="80" height="44" rx="10"/>
      <rect x="550" y="676" width="80" height="44" rx="10"/>
      <rect x="497" y="684" width="46" height="28" rx="8"/>
    </g>
    <g fill="#2b2f35"><circle cx="425" cy="698" r="4"/><circle cx="440" cy="698" r="4"/><circle cx="455" cy="698" r="4"/><circle cx="470" cy="698" r="4"/></g>
    <!-- винтове -->
    <g fill="#c9ced4"><circle cx="402" cy="190" r="5"/><circle cx="638" cy="190" r="5"/><circle cx="402" cy="730" r="5"/><circle cx="638" cy="730" r="5"/></g>
  </g>

  <!-- отвертка -->
  <g filter="url(#sh)" transform="rotate(-38 300 700)">
    <rect x="160" y="680" width="150" height="44" rx="22" fill="url(#handle)"/>
    <g fill="#fff" opacity=".22"><rect x="180" y="686" width="10" height="32" rx="5"/><rect x="200" y="686" width="10" height="32" rx="5"/><rect x="220" y="686" width="10" height="32" rx="5"/><rect x="240" y="686" width="10" height="32" rx="5"/></g>
    <rect x="300" y="694" width="170" height="16" rx="4" fill="url(#steel)"/>
    <path d="M470 694 h22 l10 8 -10 8 h-22 z" fill="#c9ced4"/>
  </g>

  <!-- пинсета -->
  <g filter="url(#sh)" transform="rotate(32 930 760)">
    <path d="M800 742 L1080 752 L1080 758 L800 750 Z" fill="url(#steel)"/>
    <path d="M800 770 L1080 760 L1080 766 L800 778 Z" fill="url(#steel)"/>
    <rect x="790" y="738" width="40" height="44" rx="8" fill="#8b9299"/>
  </g>

  <!-- лопатка -->
  <g filter="url(#sh)" transform="rotate(-62 1010 230)">
    <rect x="900" y="210" width="220" height="22" rx="11" fill="#f0e6d8"/>
    <path d="M1120 210 h40 l-20 22 h-20 z" fill="#e2d6c4"/>
  </g>

  <!-- искри/акценти -->
  <g fill="#ff8a4c">
    <circle cx="700" cy="150" r="4" opacity=".8"/><circle cx="742" cy="118" r="2.5" opacity=".6"/><circle cx="330" cy="140" r="3" opacity=".5"/><circle cx="1110" cy="560" r="3" opacity=".5"/>
  </g>
</svg>
